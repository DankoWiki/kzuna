<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>תרגול חוברת קצונה</title>
<meta name="description" content="תרגול חוברת ההכנה לקצונה (בה״ד 1): שיעורים, תרגול חכם, מבחנים ומפה אילמת. עובד גם בלי אינטרנט.">
<meta name="theme-color" content="#EDEFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121811" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קצונה">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: a field notebook in one column — an olive "mission card" on top, mode tiles, then a chapter ledger; each study mode replaces the body. The map view splits into map + sticky panel. */
:root{
  --bg:#EDEFE6;
  --paper:#F9FAF5;
  --ink:#1C251B;
  --muted:#5B6858;
  --line:#CBD2BF;
  --olive:#4A6328;
  --olive-ink:#F3F6EA;
  --brass:#946A0C;
  --ok:#256B40;
  --bad:#A8352A;
  --ok-bg:#DDEEDF;
  --bad-bg:#F6E1DD;
  --focus:#2D5C9C;
  --map-paper:#FFFFFF;
  --map-hi:#D9480F;
  --map-ok:#2C7A49;
  --map-bad:#B3261E;
  --scrim:rgba(28,37,27,.45);
  --topo-paper:#FCFAF3; --topo:#B57A45; --topo-ix:#8A5124; --topo-cliff:#3B2A1C;
  --part-bg:#F3E8CC;
  --ring:rgba(74,99,40,.22);
  --f-display:"Karantina","IBM Plex Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  --f-body:"IBM Plex Sans Hebrew","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121811; --paper:#1A2219; --ink:#E3E8DA; --muted:#9BA693; --line:#303B2D;
    --olive:#A5C070; --olive-ink:#131A11; --brass:#DDB451; --ok:#74C792; --bad:#F08F83;
    --ok-bg:#173021; --bad-bg:#3B1E1A; --focus:#8FB6F2; --scrim:rgba(0,0,0,.62); --topo-paper:#1E1B15; --topo:#A9794C; --topo-ix:#D9A271; --topo-cliff:#EBD5B5; --part-bg:#33290E; --ring:rgba(165,192,112,.28); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121811; --paper:#1A2219; --ink:#E3E8DA; --muted:#9BA693; --line:#303B2D;
  --olive:#A5C070; --olive-ink:#131A11; --brass:#DDB451; --ok:#74C792; --bad:#F08F83;
  --ok-bg:#173021; --bad-bg:#3B1E1A; --focus:#8FB6F2; --scrim:rgba(0,0,0,.62); --topo-paper:#1E1B15; --topo:#A9794C; --topo-ix:#D9A271; --topo-cliff:#EBD5B5; --part-bg:#33290E; --ring:rgba(165,192,112,.28); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
#app{max-width:780px;margin:0 auto;padding-block:0 72px}
#app.wide{max-width:1100px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{font-family:var(--f-display);font-size:32px;line-height:1;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.brand small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:8px;letter-spacing:0}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:6px 12px 6px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:15px}
.back svg{width:18px;height:18px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="cloud"] i{background:var(--ok)}
.sync[data-s="saving"] i,.sync[data-s="connecting"] i{background:var(--brass)}
@media (max-width:480px){.sync span{display:none}.brand{font-size:30px}}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;text-align:center}
.btn:hover{border-color:var(--olive)}
.btn.primary{background:var(--olive);border-color:var(--olive);color:var(--olive-ink)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.h2{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:700;margin-bottom:6px}
.h3{font-size:17px;font-weight:700;margin-bottom:10px}
.lead{color:var(--muted);font-size:15px;max-width:62ch}
.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:600;color:var(--brass)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sec{margin-bottom:32px}
.stack{display:grid;gap:14px}
.stack>.seg,.stack>.btns{justify-self:start}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:40px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--olive);color:var(--olive-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--olive-ink)}
.inp{width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);padding:8px 12px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.pg{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:16px;background:var(--olive);color:var(--olive-ink);padding:22px 22px 22px;margin-bottom:14px}
.hero>#contours{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none;fill:none;stroke:currentColor;stroke-opacity:.16}
.hero-in{position:relative;display:grid;gap:14px}
.hero .eyebrow{color:inherit;opacity:.8}
.hero-num{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.hero-num b{font-family:var(--f-display);font-size:76px;line-height:.85;font-weight:700}
.hero-num span{font-size:16px;font-weight:500;max-width:22ch}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px}
.hero-meta b{font-family:var(--f-mono);font-weight:500;font-size:16px;margin-inline-end:4px}
.btn-hero{justify-self:start;border:0;border-radius:12px;background:var(--olive-ink);color:var(--olive);font-weight:700;font-size:17px;padding:12px 22px;min-height:48px}
details.pick{margin-bottom:30px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper)}
details.pick summary{cursor:pointer;padding:12px 14px;font-weight:600;font-size:15px;list-style-position:inside}
details.pick .chips{padding:0 14px 14px}

/* modes */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.modes{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mode{display:grid;align-content:start;gap:4px;text-align:right;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);min-height:112px}
.mode:hover{border-color:var(--olive)}
.mode b{font-size:17px;line-height:1.3}
.mode span{font-size:13px;color:var(--muted);line-height:1.4}
.mode .ct{font-family:var(--f-mono);font-size:12px;color:var(--brass);font-variant-numeric:tabular-nums}

/* ledger */
.ledger{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:6px 12px;align-items:center;width:100%;padding:13px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:right}
.row:hover .ttl{color:var(--olive)}
.row .num{font-family:var(--f-mono);font-size:12px;color:var(--muted);grid-row:span 2}
.row .ttl{font-weight:600;line-height:1.35}
.row .pct{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;grid-row:span 2}
.row .sub{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.bar .m{background:var(--olive)}
.bar .l{background:var(--brass)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:14px;color:var(--muted)}
.prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--olive);transition:width .25s}
.qlabel{font-size:13px;color:var(--brass);font-weight:600;margin-bottom:6px}
.reask{display:inline-block;font-size:12px;font-weight:600;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:2px 8px;margin-bottom:8px}
.ol{list-style:none;padding:0;margin:2px 0 0;display:grid;gap:2px;font-size:14px}
.ol li{color:var(--muted);font-weight:500}
.ol li.c{color:var(--ink);font-weight:700}
.ol li.c::before{content:"✓ ";color:var(--ok)}
.qtext{font-size:21px;line-height:1.45;font-weight:600;margin-bottom:18px;text-wrap:pretty}
.qtext.big{font-family:var(--f-display);font-size:60px;line-height:1;font-weight:700}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;text-align:right;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:16px;line-height:1.45;min-height:52px}
.opt:hover{border-color:var(--olive)}
.opt .k{font-family:var(--f-mono);font-size:13px;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.opt.sel{border-color:var(--olive);background:var(--paper)}
.opts.locked .opt{cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:grid;gap:6px}
.fb .v{font-weight:700}
.fb .v.ok{color:var(--ok)}
.fb .v.bad{color:var(--bad)}
/* recall: the answer is typed first; options appear only when asked for */
.recall{display:grid;gap:10px}
.rlab{font-size:13px;font-weight:600;color:var(--muted)}
.rinrow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.rinrow .inp{flex:1 1 200px;min-width:0;min-height:52px;font-size:18px;padding:10px 14px}
.rinrow .inp:focus{border-color:var(--olive);outline:none;box-shadow:0 0 0 3px var(--ring)}
.rinrow .inp.yr{flex:0 1 auto;width:8.5ch;font-family:var(--f-mono);font-size:26px;letter-spacing:.08em;text-align:center;font-variant-numeric:tabular-nums}
.rinrow .inp.yr::placeholder{font-size:15px;letter-spacing:0;font-family:var(--f-body)}
.rinrow .inp[readonly]{background:transparent;border-style:dashed}
.rinrow .btn{min-height:52px;flex:none;padding-inline:22px}
.era{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:0 14px;min-height:52px;font-weight:600;font-size:15px;color:var(--muted)}
.era[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--paper)}
.era[disabled]{cursor:default}
.rhelp{display:flex;flex-wrap:wrap;gap:2px 18px;align-items:center}
.linkbtn{border:0;background:none;padding:6px 0;min-height:40px;font-size:14px;font-weight:600;color:var(--olive);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.linkbtn.muted{color:var(--muted)}
.linkbtn:hover{color:var(--ink)}
.rerr{font-size:14px;font-weight:600;color:var(--bad)}
.grading{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:15px;color:var(--muted);min-height:40px}
.grading i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--olive);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.selfck{display:grid;gap:10px;padding:14px 16px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.selfck .v{font-weight:700}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.cmp{grid-template-columns:minmax(0,1fr)}}
.cmp>div{display:grid;align-content:start;gap:2px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:0}
.cmp .lab{font-size:12px;font-weight:600;color:var(--muted)}
.cmp p{font-size:16px;line-height:1.45;overflow-wrap:anywhere}
.fb .v.part{color:var(--brass)}
.fb .why{font-weight:500}
.fb .mine2{font-size:14px;color:var(--muted)}
.fb .by{font-size:12px;color:var(--muted)}
.fb .linkbtn{justify-self:start;min-height:32px;padding:2px 0}
.mcnote{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.score .how{flex-basis:100%;font-size:14px}
.li .tag .hw{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;color:var(--brass);background:var(--part-bg)}
@media (prefers-reduced-motion:reduce){.grading i{animation:none}}
/* explain: a pencilled margin note from Claude under a missed item */
.exp{margin-top:10px;min-width:0}
.li .exp{margin-top:6px}
.xbtn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--olive);background:transparent;color:var(--olive);font-weight:600;font-size:14px}
.xbtn:hover{background:var(--olive);color:var(--olive-ink)}
.xbtn svg{width:17px;height:17px;flex:none}
.xbox{display:grid;gap:8px;padding:14px 16px;border-radius:12px;background:var(--part-bg);min-width:0}
.xctx{font-size:15px;line-height:1.7;max-width:64ch;overflow-wrap:anywhere}
.xtrick{font-size:15px;line-height:1.6;font-weight:600;max-width:64ch;overflow-wrap:anywhere}
.xtrick b{color:var(--brass);font-weight:700}
.xfoot{display:flex;flex-wrap:wrap;align-items:center;gap:0 14px;font-size:12px;color:var(--muted)}
.xfoot .linkbtn{min-height:32px;padding:2px 0;font-size:13px}
.xbox .grading{min-height:28px;font-size:14px}
.exp.sm{display:inline;margin:0}
.exp.sm .xbox{margin-top:8px}
.xbtn.ic{min-height:32px;min-width:32px;padding:4px;justify-content:center;border-color:transparent;vertical-align:middle;opacity:.75}
.xbtn.ic:hover,.xbtn.ic:focus-visible,.xbtn.ic.saved{opacity:1}
.xbtn.ic:hover{background:transparent;color:var(--olive);border-color:var(--olive)}
.xinl{width:16px;height:16px;vertical-align:-3px;color:var(--olive)}
.ocw{display:grid;min-width:0}
.ocw .exp{margin-top:6px}
.card + .exp{margin-top:12px}
/* ordered lists: the booklet's numbered rosters */
.roster{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--line)}
.roster li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);min-height:48px}
.roster .sn{font-family:var(--f-mono);font-size:15px;color:var(--brass);font-variant-numeric:tabular-nums;text-align:center}
.roster .nm{font-size:17px;font-weight:600;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.roster .st{font-size:13px;color:var(--muted);white-space:nowrap;text-align:end}
.roster .sub{grid-column:2/-1;font-size:13px;color:var(--muted);font-weight:500}
.roster li.ok .st{color:var(--ok);font-weight:700}
.roster li.moved .nm{color:var(--brass)}
.roster li.moved .st{color:var(--brass);font-weight:600}
.roster li.miss .nm{color:var(--muted);font-weight:500;text-decoration:underline dashed var(--bad);text-underline-offset:5px}
.roster li.miss .st{color:var(--bad);font-weight:600}
.roster .cover{width:100%;min-height:38px;border:1.5px dashed var(--line);background:transparent;border-radius:8px;padding:4px 12px;color:var(--muted);font-size:14px;font-weight:600;text-align:start}
.roster .cover:hover{border-color:var(--olive);color:var(--olive)}
.roster .open{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:start;cursor:pointer}
.oc .ordn{display:block;font-size:13px;color:var(--brass);font-weight:600}
.sqmeta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.sqmeta b{font-family:var(--f-mono);font-weight:500;color:var(--ink);margin-inline-end:4px}
textarea#sqw{min-height:300px;font-size:19px;line-height:1.7}
.actbar{position:sticky;bottom:0;z-index:4;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.actbar .hint{font-size:12px;color:var(--muted);margin-inline-start:auto}
@media (max-width:640px){.actbar .hint{display:none}}

/* summary */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-block:6px 18px}
.score b{font-family:var(--f-display);font-size:96px;line-height:.85}
.score span{color:var(--muted)}
table.bd{width:100%;border-collapse:collapse;font-size:14px}
table.bd td,table.bd th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
table.bd th{font-weight:600;color:var(--muted);font-size:12px}
table.bd td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}

/* list rows */
.list{display:grid;border-top:1px solid var(--line)}
.li{display:grid;gap:3px;padding:12px 2px;border-bottom:1px solid var(--line)}
.li .tag{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.li .q{font-weight:500}
.li .a{font-weight:700}
.li .a .yr{font-family:var(--f-mono);font-weight:500}
.li .e{font-size:14px;color:var(--muted)}
.li .mine{font-size:14px;color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.s1{background:var(--brass)}
.dot.s2{background:var(--olive)}

/* flashcards */
.card{display:grid;align-content:center;gap:12px;min-height:280px;padding:26px 22px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);text-align:center;width:100%}

/* timeline */
.tl{display:grid;border-inline-start:2px solid var(--line);padding-inline-start:18px;margin-inline-start:6px}

.oc.bad{border-color:var(--bad);background:var(--bad-bg)}

/* map */
.mapgrid{display:grid;gap:16px;align-items:start}
.mpanel{order:2;position:sticky;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.mapscroll{order:1;overflow-x:auto;border-radius:12px;border:1.5px solid var(--line);background:var(--map-paper)}
.mapwrap{position:relative;margin:0 auto;width:100%}

.mask{position:absolute;padding:0;border:0;border-radius:3px;background:var(--map-paper);box-shadow:0 0 0 1px rgba(0,0,0,.08)}

.mask.slot{box-shadow:0 0 0 1.5px rgba(60,70,60,.45);cursor:pointer}
.mask.slot:hover{box-shadow:0 0 0 2.5px var(--map-hi)}
.mask.tgt{box-shadow:0 0 0 3px var(--map-hi);background:var(--map-paper)}
.mask.tgt::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--map-hi);font-weight:700;font-size:14px}
.mask.tgt.open::after{content:none}
.mask.tgt.open{background:transparent}
.mask.good{box-shadow:0 0 0 3px var(--map-ok)}
.mask.wrong{box-shadow:0 0 0 3px var(--map-bad)}
.mask.study{cursor:pointer}
.mask.noop{pointer-events:none}
.ring{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--map-hi);pointer-events:none;animation:pulse 1.4s ease-out infinite}
.ring.good{border-color:var(--map-ok)}
.ring.wrong{border-color:var(--map-bad)}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:.25}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}.prog i{transition:none}}
.mopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* anthem */

textarea.inp{min-height:240px;font-size:20px;line-height:1.75;padding:14px;resize:vertical}

/* reading */

/* bottom tab bar on the home screen */

ות (רעיונות, סמלים ומסורות).","p":15,"c":"g1","t":"מדינה יהודית ודמוקרטית","id":"98f8c4a456"},{"k":"q","q":"אילו סוגיות מרכזיות בדיון על משמעות \"דמוקרטיה\" בישראל מוצגות בחוברת?","a":"עקרון הייצוגיות, יחסי רוב ומיעוט, השאיפה לשוויון מול חירות הפרט","w":["עקרון הפרדת הרשויות, חופש העיתונות, שלטון החוק מול ביטחון המדינה","שיטת הבחירות היחסית, הצורך בחוקה כתובה, ביקורת שיפוטית על חקיקה","שוויון בנטל הגיוס, חופש דת וחופש מדת, חופש הביטוי מול הסתה"],"e":"שלוש הסוגיות: ייצוגיות, רוב ומיעוט, ושוויון מול חירות הפרט.","p":15,"c":"g1","t":"מדינה יהודית ודמוקרטית","id":"a8984a8670"},{"k":"q","q":"על-פי סיכום השער, איזה חלק מתושבי ישראל מגדירים עצמם כיהודים?","a":"שלושה מכל ארבעה","w":["שניים מכל שלושה","ארבעה מכל חמישה","תשעה מכל עשרה"],"e":"הצביון היהודי בא לידי ביטוי בדמוגרפיה (3 מכל 4), בחקיקה (חוק השבות), בתרבות ובטריטוריה.","p":23,"c":"g1","t":"מדינה יהודית ודמוקרטית","id":"584486b60d"},{"k":"q","q":"איזה חוק מובא בחוברת כדוגמה לחקיקה המקנה עדיפות אזרחית ליהודים?","a":"חוק השבות","w":["חוק שעות עבודה ומנוחה","חוק השיפוט הצבאי","חוק יסוד: הממשלה"],"e":"חוק השבות מובא כביטוי לצביון היהודי בחקיקה.","p":23,"c":"g1","t":"מדינה יהודית ודמוקרטית","id":"2b87d95c52"},{"k":"q","q":"מי העניק את מנורת הכנסת במתנה לממשלת ישראל?","a":"ממשלת בריטניה","w":["ממשלת ארצות הברית","ממשלת גרמניה","ההסתדרות הציונית"],"e":"המנורה, אנדרטת ברונזה בגן הוורדים מול הכנסת, הוענקה במתנה מידי ממשלת בריטניה.","p":13,"c":"g1","t":"מנורת הכנסת","id":"26f8bf44b8"},{"k":"q","q":"כמה אירועים, דמויות וסיפורים מפוסלים על מנורת הכנסת?","a":"כשלושים","w":["שבעה","שנים-עשר","כמאה"],"e":"על המנורה מפוסלים כשלושים אירועים, דמויות וסיפורים מכוננים מתולדות העם היהודי.","p":13,"c":"g1","t":"מנורת הכנסת","id":"9c441f9de2"},{"k":"q","q":"על שתי אילו מערכות מבוסס אופייה הדמוקרטי של מדינה?","a":"מערכת פורמלית-מוסדית ומערכת ערכית-תרבותית","w":["מערכת חוקתית-משפטית ומערכת פוליטית-מפלגתית","מערכת שיפוטית-עצמאית ומערכת מבצעת-נבחרת","מערכת חברתית-קהילתית ומערכת כלכלית-חופשית"],"e":"הפורמלית: הכרעת רוב, אופוזיציה, בחירות חופשיות; הערכית: כבוד האדם, זכויות, זכויות מיעוטים, קבלת תוצאות.","p":16,"c":"g1","t":"יסודות המשטר הדמוקרטי","id":"8443b5b6e9"},{"k":"q","q":"מה מהבאים שייך למערכת הפורמלית-מוסדית של הדמוקרטיה?","a":"הכרעת הרוב, אופוזיציה ובחירות חופשיות","w":["שמירה על כבוד האדם ועל זכויות האזרח","שמירה על זכויות המיעוטים ועל תרבותם","השאיפה לחירות ולשוויון וקבלת תוצאות הבחירות"],"e":"אלו התהליכים המוסכמים שבאמצעותם מתממש עקרון ריבונות העם: הכרעת הרוב, קיום אופוזיציה ובחירות חופשיות ושוויוניות.","p":16,"c":"g1","t":"יסודות המשטר הדמוקרטי","o":1,"id":"220f948043"},{"k":"q","q":"מהו העיקרון המשותף לכל הדמוקרטיות לפי החוברת?","a":"ריבונות העם","w":["הפרדת רשויות","שיטת בחירות יחסית","קיום חוקה כתובה"],"e":"אין צורה אחת \"נכונה\" של דמוקרטיה, אך העיקרון הבסיסי של ריבונות העם משותף לכולן.","p":16,"c":"g1","t":"יסודות המשטר הדמוקרטי","id":"fe64a06e98"},{"k":"q","q":"מה משמעות עקרון הפרדת הרשויות?","a":"חלוקת השלטון לשלוש רשויות המאזנות ובולמות זו את זו","w":["הפרדה מלאה בין מוסדות הדת לבין מוסדות המדינה","הפרדה בין הצבא לבין הפוליטיקה ומניעת מעורבותו בה","הפרדה בין השלטון המרכזי לבין השלטון המקומי בערים"],"e":"שלוש הרשויות: מחוקקת, מבצעת ושופטת. כשהרשויות נפרדות הכוח מבוזר; ריכוזו בידי אדם אחד עלול להביא לשחיתות ולפגיעה בחירות.","p":16,"c":"g1","t":"יסודות המשטר הדמוקרטי","id":"e070e26353"},{"k":"q","q":"כמה חברים מכהנים בכנסת?","a":"120","w":["100","71","150"],"e":"120 חברים הנבחרים אחת לארבע שנים (אם אין בחירות מוקדמות).","p":16,"c":"g1","t":"הכנסת – הרשות המחוקקת","id":"5b1ea9a941"},{"k":"q","q":"מהו מקור השם \"כנסת\"?","a":"הכנסת הגדולה שהתכנסה בירושלים בימי הבית השני","w":["בית הכנסת, מקום התכנסות הקהל לתפילה בגולה","הסנהדרין שישבה ביבנה לאחר חורבן הבית השני","כנסת ישראל, מוסד הנבחרים של יהודי הארץ בתקופת המנדט"],"e":"השם לקוח מ\"הכנסת הגדולה\" מימי הבית השני.","p":16,"c":"g1","t":"הכנסת – הרשות המחוקקת","id":"5712562fae"},{"k":"q","q":"אחת לכמה שנים נבחרת הכנסת (בהנחה שאין בחירות מוקדמות)?","a":"ארבע","w":["שלוש","חמש","שש"],"e":"","p":16,"c":"g1","t":"הכנסת – הרשות המחוקקת","id":"a5ddc21e0b"},{"k":"q","q":"מהם שני התפקידים המרכזיים של הכנסת?","a":"חקיקת חוקים ובקרה על עבודת הממשלה","w":["חקיקת חוקים ושפיטה","בחירת הנשיא ומינוי שרים","ניהול משרדי הממשלה ואישור מינויים"],"e":"","p":17,"c":"g1","t":"הכנסת – הרשות המחוקקת","id":"1eaad8f4a5"},{"k":"q","q":"מה מהבאים אינו כלי של הכנסת לבקרה על הממשלה?","a":"מינוי שופטי בית המשפט העליון","w":["הצבעת אי-אמון","הגשת שאילתות","אישור תקציב המדינה במליאה"],"e":"הבקרה נעשית בהצבעת אי-אמון, בשאילתות ובנושאים לסדר היום, ובחובת אישור צעדים כמו תקציב, חוזה שלום ויציאה למלחמה.","p":17,"c":"g1","t":"הכנסת – הרשות המחוקקת","o":1,"id":"bf97840975"},{"k":"q","q":"מהו תפקידה של האופוזיציה בכנסת?","a":"להציע אלטרנטיבה לפעולות הממשלה ולהוביל את הביקורת עליה","w":["לגבות בכנסת את צעדי הממשלה ולהגן עליהם בהצבעות","לבחור מבין חבריה את ראש הממשלה ואת השרים בממשלה החדשה","לנהל את ועדות הכנסת ולקבוע את סדר היום של המליאה"],"e":"הקואליציה מגבה את הממשלה; האופוזיציה מציעה חלופה ומבקרת.","p":16,"c":"g1","t":"הכנסת – הרשות המחוקקת","id":"97b9cded68"},{"k":"q","q":"באיזה שלב של החקיקה עוסקות ועדות הכנסת בעיצוב החוק?","a":"לאחר הקריאה הראשונה ולפני הקריאה השנייה והשלישית","w":["לפני הקריאה הראשונה, כשהצעת החוק עוד לא הוצגה למליאה","לאחר הקריאה השלישית ולפני פרסום החוק ברשומות","רק לאחר שהממשלה אישרה את החוק ולפני הקריאה הראשונה"],"e":"הוועדות מעצבות את החוק לאחר שהתקבל עקרונית בקריאה ראשונה.","p":17,"c":"g1","t":"הכנסת – הרשות המחוקקת","id":"d63c1a16ef"},{"k":"q","q":"מהו הגוף המרכזי של הכנסת שבו חברים כל חברי הכנסת?","a":"המליאה","w":["ועדת הכנסת","הקבינט","ועדת החוץ והביטחון"],"e":"במליאה נדונים נושאים עקרוניים ומתקבלות ההחלטות על חקיקה.","p":17,"c":"g1","t":"הכנסת – הרשות המחוקקת","id":"3d478fd002"},{"k":"q","q":"מהי שיטת הבחירות בישראל?","a":"פרלמנטרית – הציבור בוחר במפלגות, והמפלגות חוברות להקמת ממשלה","w":["נשיאותית – הציבור בוחר ישירות את ראש הרשות המבצעת ואת סגנו","אזורית – כל אזור בחירה שולח לכנסת נציג אחד, והרוב מקים ממשלה","עקיפה – חברי הכנסת נבחרים בידי המועצות המקומיות, והן בוחרות ממשלה"],"e":"","p":16,"c":"g1","t":"הכנסת – הרשות המחוקקת","id":"8e3d889102"},{"k":"q","q":"מה ההבדל בין הקואליציה לאופוזיציה?","a":"הקואליציה – המפלגות השותפות בממשלה; האופוזיציה – המפלגות שאינן שותפות בה","w":["הקואליציה – המפלגות הדתיות שבכנסת; האופוזיציה – המפלגות החילוניות שבכנסת","הקואליציה – ועדות הכנסת והחברים בהן; האופוזיציה – מליאת הכנסת כולה","הקואליציה – השרים שאינם חברי כנסת; האופוזיציה – כל שאר חברי הכנסת"],"e":"במצב תקין הקואליציה גדולה מהאופוזיציה; אחרת הממשלה אינה יכולה לפעול.","p":16,"c":"g1","t":"הכנסת – הרשות המחוקקת","id":"6bbeb0ba40"},{"k":"q","q":"מה תפקידה של הקואליציה בכנסת?","a":"לגבות בכנסת את צעדי הממשלה ולנסות להגן עליהם","w":["להציע לציבור אלטרנטיבה לממשלה ולהוביל את הביקורת עליה","לבחור את שופטי בית המשפט העליון","לספק סעד לאזרחים שנפגעו מפעולות המדינה"],"e":"תפקיד האופוזיציה הוא להציע אלטרנטיבה ולהוביל את הביקורת.","p":16,"c":"g1","t":"הכנסת – הרשות המחוקקת","id":"2079337f85"},{"k":"q","q":"מי מטיל את הרכבת הממשלה על חבר הכנסת בעל הסיכוי הגבוה ביותר להצליח?","a":"נשיא המדינה","w":["יושב ראש הכנסת","נשיא בית המשפט העליון","ועדת הבחירות המרכזית"],"e":"לאחר הבחירות מזמן הנשיא את נציגי המפלגות ומטיל את המשימה.","p":17,"c":"g1","t":"הממשלה – הרשות המבצעת","id":"9eda34531b"},{"k":"q","q":"מה נכון לגבי מינוי שרים בישראל?","a":"ראש הממשלה יכול למנות גם מי שאינו חבר כנסת","w":["רק חברי כנסת מהקואליציה יכולים להתמנות לשרים","השרים נבחרים ישירות על-ידי הציבור בבחירות","השרים ממונים על-ידי נשיא המדינה לפי המלצת הכנסת"],"e":"השרים ברובם חברי כנסת מהקואליציה, אך אפשר למנות גם מי שאינו ח\"כ.","p":17,"c":"g1","t":"הממשלה – הרשות המבצעת","o":1,"id":"321c58916d"},{"k":"q","q":"כיצד נקראים העקרונות שהממשלה מציגה בפני הכנסת עם הרכבתה?","a":"קווי היסוד","w":["מגילת העקרונות","חוקי היסוד","ההסכם הקואליציוני"],"e":"","p":17,"c":"g1","t":"הממשלה – הרשות המבצעת","id":"4c9b938c51"},{"k":"q","q":"איזה משרד אחראי על השב\"כ והמוסד?","a":"משרד ראש הממשלה","w":["משרד הביטחון","המשרד לביטחון פנים","משרד החוץ"],"e":"","p":18,"c":"g1","t":"הממשלה – הרשות המבצעת","id":"49e8f35d51"},{"k":"q","q":"איזה משרד אחראי על המשטרה לפי החוברת?","a":"המשרד לביטחון פנים","w":["משרד הביטחון","משרד ראש הממשלה","המשרד לשירותי דת"],"e":"","p":18,"c":"g1","t":"הממשלה – הרשות המבצעת","id":"0ad2d0c857"},{"k":"q","q":"כיצד מכונה הגוף המצומצם של שרים הדן בנושאים הדורשים הכרעה מיידית, בעיקר בתחום הביטחוני?","a":"קבינט או \"מטבחון\"","w":["מליאת הממשלה","ועדת השרים לחקיקה","ועדת החוץ והביטחון"],"e":"","p":18,"c":"g1","t":"הממשלה – הרשות המבצעת","id":"d8099e6b93"},{"k":"q","q":"איזו אחריות נושא כל שר?","a":"אחריות משותפת להחלטות הממשלה, ואחריות בלבדית על פעולות משרדו","w":["אחריות בלבדית על פעולות משרדו, ללא אחריות להחלטות הממשלה","אחריות אישית כלפי נשיא המדינה בלבד, ולא כלפי הכנסת או הממשלה","אחריות משותפת להחלטות הממשלה, ללא אחריות על פעולות משרדו"],"e":"","p":18,"c":"g1","t":"הממשלה – הרשות המבצעת","id":"13f5872a74"},{"k":"q","q":"ממי מורכבת הממשלה?","a":"מסך כל השרים, ובראשם ראש הממשלה","w":["מכל 120 חברי הכנסת, ובראשם יו\"ר הכנסת","מחברי הקבינט בלבד, ובראשם שר הביטחון","ממנהלי משרדי הממשלה ומהיועץ המשפטי"],"e":"","p":17,"c":"g1","t":"הממשלה – הרשות המבצעת","id":"f776539825"},{"k":"q","q":"תביעה של אדם הרואה עצמו נפגע מפעילות רשויות המדינה שייכת ל:","a":"משפט מנהלי","w":["משפט אזרחי","משפט פלילי","משפט צבאי"],"e":"אזרח מול אזרח – אזרחי; מדינה מול אזרח – פלילי; אדם מול רשויות המדינה – מנהלי.","p":18,"c":"g1","t":"בתי המשפט – הרשות השופטת","id":"d58811e21b"},{"k":"q","q":"תביעה של המדינה כלפי אזרחיה נקראת:","a":"משפט פלילי","w":["משפט אזרחי","משפט מנהלי","משפט חוקתי"],"e":"","p":18,"c":"g1","t":"בתי המשפט – הרשות השופטת","id":"0816a87377"},{"k":"q","q":"מהו העיקרון החשוב ביותר במערכת המשפט, המהווה תנאי לאמון הציבור בה?","a":"היותה ניטרלית, עצמאית ונטולת פניות","w":["היותה מהירה, יעילה וזמינה לכל אזרח","היותה כפופה לכנסת ולהחלטות הממשלה","היותה נבחרת על-ידי הציבור בבחירות ישירות"],"e":"לכן השופטים נבחרים בוועדה מיוחדת ולא ניתן לפטר שופט.","p":18,"c":"g1","t":"בתי המשפט – הרשות השופטת","id":"5a31a2549c"},{"k":"q","q":"באיזה גיל מסיים שופט את תפקידו באופן אוטומטי?","a":"70","w":["65","67","75"],"e":"אין אפשרות לפטר שופט; הוא פורש אוטומטית בגיל שבעים.","p":18,"c":"g1","t":"בתי המשפט – הרשות השופטת","id":"356fce5fee"},{"k":"q","q":"מי בוחר את השופטים בישראל?","a":"ועדה מיוחדת","w":["חברי הכנסת","הציבור בבחירות","נשיא המדינה לבדו"],"e":"","p":18,"c":"g1","t":"בתי המשפט – הרשות השופטת","id":"0010f63502"},{"k":"q","q":"אילו שלושה עקרונות יסוד של מערכת המשפט מוצגים בחוברת?","a":"הזכות להליך הוגן, פומביות המשפט, שוויון בפני החוק","w":["חזקת החפות, זכות השתיקה, הזכות לייצוג משפטי בחינם","עצמאות השופטים, מקצועיות המערכת, יעילות הדיונים","עקרון החוקיות, עקרון הסבירות, עקרון המידתיות בעונש"],"e":"","p":18,"c":"g1","t":"בתי המשפט – הרשות השופטת","id":"70ff195705"},{"k":"q","q":"מהו סדר הערכאות בישראל מהנמוכה לגבוהה?","a":"שלום ← מחוזי ← עליון","w":["מחוזי ← שלום ← עליון","שלום ← עליון ← מחוזי","מחוזי ← עליון ← גבוה לצדק"],"e":"","p":19,"c":"g1","t":"בתי המשפט – הרשות השופטת","id":"3f9c55215d"},{"k":"q","q":"באיזה בית משפט נדונות בעיקר עבירות פליליות חמורות וסכסוכים כספיים גדולים?","a":"בית המשפט המחוזי","w":["בית משפט השלום","בית המשפט העליון","בית הדין לעבודה"],"e":"","p":19,"c":"g1","t":"בתי המשפט – הרשות השופטת","id":"4fac466e62"},{"k":"q","q":"באיזו עיר אין בית משפט מחוזי לפי החוברת?","a":"אילת","w":["נצרת","לוד","באר שבע"],"e":"בתי המשפט המחוזיים: ירושלים, תל-אביב, חיפה, נצרת, לוד ובאר שבע.","p":19,"c":"g1","t":"בתי המשפט – הרשות השופטת","o":1,"id":"616123b31d"},{"k":"q","q":"מה פירוש ראשי התיבות בג\"ץ?","a":"בית משפט גבוה לצדק","w":["בית גבוה של צדק","בית גבוה לציבור","בית דין גבוה לצבא"],"e":"בית המשפט העליון יושב גם כבג\"ץ ודן בעתירות נגד המדינה ורשויותיה.","p":19,"c":"g1","t":"בתי המשפט – הרשות השופטת","id":"c7e5ab01c1"},{"k":"q","q":"מה מהבאים אינו בית משפט מיוחד המוזכר בחוברת?","a":"בית משפט לביטחון","w":["בית משפט לנוער","בית משפט למשפחה","בית משפט לתעבורה"],"e":"בתי משפט מיוחדים: נוער, משפחה, עבודה, תעבורה ועוד.","p":19,"c":"g1","t":"בתי המשפט – הרשות השופטת","o":1,"id":"675d8caa2b"},{"k":"q","q":"במה דן בג\"ץ?","a":"בעתירות של אזרחים או גופים הרואים עצ ם הצליח חלקית, אך סימן לראשונה את היהודים באופן ממוסד כזרים.","p":85,"c":"g4","t":"רדיפת היהודים בגרמניה","id":"1b364d8ded"},{"k":"q","q":"מה התרחש ב-10 במאי 1933?","a":"טקס פומבי של שריפת ספרים של סופרים יהודים","w":["חקיקת חוקי נירנברג נגד יהודי גרמניה","ליל הבדולח, הפוגרום הגדול ביהודי גרמניה","החרם הכללי על בתי העסק של היהודים"],"e":"","p":85,"c":"g4","t":"רדיפת היהודים בגרמניה","id":"4f68ac5416"},{"k":"q","q":"מה קבעו חוקי נירנברג?","a":"אזרחי המדינה חייבים להיות \"בעלי דם גרמני\"; נאסרו נישואי תערובת","w":["יש לגרש את כל היהודים מגרמניה עד סוף 1935; רכושם יוחרם","יש לרכז את היהודים בגטאות סגורים; נאסרה יציאתם מהם","יש להחרים את הרכוש היהודי; נאסר על יהודים להחזיק עסקים ובתי חרושת"],"e":"","p":85,"c":"g4","t":"רדיפת היהודים בגרמניה","id":"e0a2ca68ec"},{"k":"q","q":"כיצד כונה בן לנישואי תערובת בתקנות הנאציות?","a":"מישלינג","w":["יודנראט","אריזציה","אקציה"],"e":"","p":85,"c":"g4","t":"רדיפת היהודים בגרמניה","id":"b6cd8046be"},{"k":"q","q":"איזה אירוע ב-1936 הביא להפוגה זמנית ברדיפות?","a":"המשחקים האולימפיים בברלין","w":["ועידת אוויאן בצרפת","הסכם מינכן עם בריטניה","מות הנשיא פאול פון הינדנבורג"],"e":"","p":86,"c":"g4","t":"רדיפת היהודים בגרמניה","id":"6ba2b01f62"},{"k":"q","q":"מהי \"אריזציה\"?","a":"השתלטות אלימה על בתי עסק ונכסים יהודיים","w":["גירוש יהודים מבתיהם אל מעבר לגבול פולין","סימון יהודים בטלאי צהוב על בגדיהם","שריפת ספרים של סופרים יהודים בכיכר"],"e":"","p":86,"c":"g4","t":"רדיפת היהודים בגרמניה","id":"2c96f87c87"},{"k":"q","q":"מה שימש כעילה לליל הבדולח?","a":"רצח המזכיר בשגרירות גרמניה בצרפת","w":["הצתת בניין הפרלמנט הגרמני בברלין","כישלון ועידת אוויאן לקליטת פליטים","פלישת גרמניה לפולין ופרוץ המלחמה"],"e":"","p":86,"c":"g4","t":"רדיפת היהודים בגרמניה","id":"0a182777b7"},{"k":"q","q":"כמה בתי כנסת הוצתו ונהרסו בליל הבדולח?","a":"יותר מ-1,400","w":["כ-100 בלבד","פחות מ-400","יותר מ-30,000"],"e":"וכן למעלה מ-8,000 חנויות נשרפו ונשדדו.","p":86,"c":"g4","t":"רדיפת היהודים בגרמניה","id":"62bc4594f3"},{"k":"q","q":"כמה יהודים נרצחו בליל הבדולח וכמה נעצ 9b"},{"k":"q","q":"מה הוכיח הטבח בחברון ובצפת?","a":"שהמאבק הערבי מכוון נגד כל נוכחות יהודית בארץ","w":["שהבריטים מגינים ביעילות על היהודים בערים","שכוחות ההגנה חזקים דיים להגן על כל יישוב","שהסכסוך הוא כלכלי ונוגע רק לקרקעות"],"e":"ולא רק נגד היישוב החדש – גם נגד הקהילות הוותיקות.","p":111,"c":"g5","t":"מאורעות תרפ\"ט","id":"a3763a58be"},{"k":"q","q":"מה דרש הוועד הערבי העליון מהבריטים?","a":"הפסקת העלייה ומכירת הקרקעות ומסירת השלטון לרוב הערבי","w":["חלוקת הארץ לשתי מדינות ומסירת ירושלים לשליטה ערבית","הקמת מדינה דו-לאומית עם שוויון בין שני העמים","הכרה במופתי כמלך ארץ-ישראל ופינוי הבריטים ממנה"],"e":"הפסקת העלייה היהודית, איסור מכירת קרקעות ליהודים והעברת השליטה לרוב הערבי.","p":112,"c":"g5","t":"המרד הערבי הגדול ועדת פיל","id":"25469d4b00"},{"k":"q","q":"מה היה חדש במאורעות 1936 לעומת המאורעות הקודמים?","a":"פעולות מתוכננות של קבוצות חמושות ולא התפרעויות המוניות","w":["הבריטים עמדו מנגד ולא התערבו כלל בהתפרעויות ההמוניות בערים","בפעם הראשונה היו בהם הרוגים בקרב היהודים","הם התרחשו בפעם הראשונה בירושלים ובערים"],"e":"","p":112,"c":"g5","t":"המרד הערבי הגדול ועדת פיל","id":"bdccd190eb"},{"k":"q","q":"מי היו הנוטרים?","a":"שוטרים יהודים שגייסו הבריטים, כיסוי חוקי להגנה","w":["חברי האצ\"ל שפעלו במחתרת נגד הבריטים ונגד הערבים","שומרי ארגון השומר שהגנו על המושבות בימי העות'מאנים","חיילי הבריגדה היהודית שלחמו בצבא הבריטי באיטליה"],"e":"שוטרים יהודים שגויסו בידי הבריטים ושימשו כיסוי חוקי לפעילות ההגנה.","p":112,"c":"g5","t":"המרד הערבי הגדול ועדת פיל","id":"157240fca4"},{"k":"q","q":"מה הציעה ועדת פיל?","a":"חלוקה לשתי מדינות, ואזור ירושלים בריבונות בריטית","w":["מדינה דו-לאומית אחת, בשלטון משותף ליהודים ולערבים","המשך המנדט הבריטי, עם הגבלת העלייה ומכירת קרקעות","מדינה ערבית אחת, עם אוטונומיה ליישובים היהודיים"],"e":"גם נמל יפו והמסדרון לירושלים יישארו בריבונות בריטית. המדינה היהודית – מישור החוף, השרון, הכרמל והעמקים (ה-N היישובי).","p":112,"c":"g5","t":"המרד הערבי הגדול ועדת פיל","id":"fa360969a3"},{"k":"q","q":"כיצד הגיבו הצדדים להצעת ועדת פיל?","a":"היהודים התלבטו; רוב הערבים דחו על הסף","w":["שני הצדדים קיבלו את ההצעה בהסתייגויות","היהודים דחו על הסף; רוב הערבים התלבטו","שני הצדדים דחו את ההצעה על הסף"],"e":"","p":112,"c":"g5","t":"המרד הערבי הגדול ועדת פיל","id":"4bd0c2a705"},{"k":"q","q":"מה עשו הבריטים כשהמורדים השתלטו על העיר העתיקה בקיץ 1938?","a":"הטילו מצור וכבשו אותה מחדש בקרב בן חמישה ימים","w":["נסוגו מירושלים והעבירו את מטה הממשל לחיפה","הכריזו על חלוקת העיר בין יהודים לערבים","פנו לחבר הלאומים וביקשו כוח בין-לאומי"],"e":"","p":113,"c":"g5","t":"המרד הערבי הגדול ועדת פיל","id":"b7e87929c0"},{"k":"q","q":"לאן הוגלו חברי הוועד הערבי העליון ב-1937?","a":"לאיי סיישל","w":["למצרים","לקפריסין","לעירק"],"e":"לאחר רצח לואיס אנדרוס; חאג' אמין ברח ללבנון.","p":113,"c":"g5","t":"המרד הערבי הגדול ועדת פיל","id":"1018d60bf0"},{"k":"q","q":"מה מטרתו של \"כביש הצפון\" שנסלל ב-1939?","a":"כביש ביטחון על גבול לבנון למניעת חדירת נשק וטרור","w":["כביש אזרחי לחיבור חיפה לטבריה ולעמק הירדן","כביש גישה לשמירה על צינור הנפט מעיראק לחיפה","כביש לחיבור יישובי חומה ומגדל בגליל המערבי"],"e":"","p":113,"c":"g5","t":"המרד הערבי הגדול ועדת פיל","id":"4bb8f9ac8c"},{"k":"q","q":"מהן \"מצודות טיגרט\"?","a":"מצודות משטרה שבנו הבריטים להגברת השליטה והביטחון","w":["מבצרים צלבניים ששופצו בידי הבריטים לשימוש הצבא","יישובי חומה ומגדל שהוקמו בלילה אחד בגליל","בסיסי ההגנה שהוסתרו בקיבוצים מעיני הבריטים"],"e":"מג\"ב אימץ את תבנית המצודה בסמלו.","p":113,"c":"g5","t":"המרד הערבי הגדול ועדת פיל","id":"4960fbb0e8"},{"k":"q","q":"מהי מדיניות \"ההבלגה\"?","a":"הימנעות מתגובה בפעולות טרור נגדיות ומפגיעה בחפים מפשע","w":["תגובה חריפה על כל התקפה, גם בפגיעה ביישובים ערביים","שיתוף פעולה עם הערבים המתונים נגד הכנופיות","הפסקת העלייה והקמת היישובים עד שיחזור השקט לארץ ולדרכים"],"e":"ה\"הגנה\" פעלה לפיה; האצ\"ל לא.","p":113,"c":"g5","t":"המרד הערבי הגדול ועדת פיל","id":"012a9f73fe"},{"k":"q","q":"מה אפיין את יישובי \"חומה ומגדל\"?","a":"הקמה מהירה עם גדר עץ וחצץ, מגדל שמירה וצריפים","w":["יישובים עירוניים עם בתי אבן, חומה ושער","התיישבות בהון פרטי של משקיעים, עם משקי "e":"התחקיר הוא כלי מנהיגותי ומקצועי של המפקד ללמידה והשתפרות.","p":209,"c":"g8","t":"מהו תחקיר","id":"e91adb1dbe"},{"k":"q","q":"מה ההבדל בין תחקיר לחקירה?","a":"התחקיר נועד ללמוד ולשפר; החקירה בודקת חשד לעבירה","w":["התחקיר מחפש אשמים; החקירה נועדה ללמוד לקחים","החקירה מבוצעת בידי המפקד; התחקיר בידי מצ\"ח","אין הבדל; שני המונחים מתארים את אותו הליך"],"e":"התחקיר צופה לעתיד – לשפר ולמנוע הישנות; חקירה בודקת חשד לעבירה פלילית.","p":209,"c":"g8","t":"מהו תחקיר","id":"4ee502eceb"},{"k":"q","q":"מהי תכלית התחקיר ויישום הלקחים?","a":"לשפר את המועילות המבצעית ולמנוע הישנות אירועים","w":["לאתר את האשמים באירוע ולהעביר את שמותיהם לשיפוט","לתעד את האירוע לצורכי ארכיון והיסטוריה","לקבוע את גובה הפיצויים לנפגעים באירוע"],"e":"תכלית התחקיר: לשפר את המועילות המבצעית ולמנוע הישנות אירועים בלתי רצויים.","p":209,"c":"g8","t":"מהו תחקיר","id":"c930842917"},{"k":"q","q":"כיצד רואה תפיסת הבטיחות בצה\"ל את הבטיחות?","a":"כחלק מהמקצועיות – רמת הבטיחות מותנית ביכולת המקצועית","w":["כתחום נפרד מהמקצועיות – שבו מטפלים אנשי הבטיחות של היחידה","כאחריות קצין הבטיחות בלבד – ולא של המפקדים","כדבר שבא על חשבון המשימה – ויש לאזן ביניהם"],"e":"","p":209,"c":"g8","t":"מהו תחקיר","id":"35348aa54a"},{"k":"q","q":"מדוע פורמט התחקיר מחייב ואחיד?","a":"כדי לאפשר למידה הדדית בין יחידות","w":["כדי לקצר את זמן הכתיבה של המפקד","כדי להקל על עבודת חוקרי מצ\"ח","כדי למנוע ערעורים על מסקנות התחקיר"],"e":"הלמידה ההדדית נעשית באמצעות הפצת תחקירים בין היחידות.","p":209,"c":"g8","t":"מהו תחקיר","id":"00c87ec3e2"},{"k":"q","q":"מה מתבצע לפני כתיבת התחקיר?","a":"תחקור – איסוף ממצאים, הסקת מסקנות והפקת לקחים","w":["חקירת מצ\"ח – גביית עדויות ואיסוף ראיות פליליות","שימוע – זימון המעורבים לשמיעת טענותיהם","הפצה – שליחת טיוטת הדו\"ח לכלל היחידות"],"e":"","p":210,"c":"g8","t":"מהו תחקיר","id":"2ec34dfa47"},{"k":"q","q":"על איזו הוראה מבוססת כתיבת התחקיר?","a":"הוראות אמ\"ץ – תוה\"ד 8.4","w":["פקודת מטכ\"ל 33.0101","חוק השיפוט הצבאי 1955","תורת הלחימה – פרק 1"],"e":"","p":210,"c":"g8","t":"מהו תחקיר","id":"a53937ede2"},{"k":"q","q":"מהו \"אירוע בטיחות\"?","a":"אירוע שבו נגרמה או עלולה הייתה להיגרם תאונה","w":["רק אירוע שבו נפגע אדם ונזקק לטיפול רפואי","אירוע מבצעי שבו הייתה היתקלות עם האויב","הפרת משמעת של חייל שלא גרמה לנזק"],"e":"כולל תקרית בטיחות – אירוע שבו עלולה הייתה להיגרם תאונה.","p":210,"c":"g8","t":"הגדרות","id":"a987e012bc"},{"k":"q","q":"מהו \"ממצא\"?","a":"פריט מידע עובדתי על האירוע, החשוב לתחקיר","w":["החלטה לתקן ליקוי או לחזק יתרון","תוצאה של ניתוח הממצאים לאור אמות מידה","הצעה לרמה הממונה לטיפול בפער"],"e":"פריט מידע עובדתי על האירוע המתוחקר שיש לו חשיבות לאירוע ולתחקיר.","p":210,"c":"g8","t":"הגדרות","id":"72f69a5481"},{"k":"q","q":"מהי \"מסקנה\"?","a":"תולדה של ניתוח הממצאים לאור אמות מידה מוסכמות","w":["פריט מידע עובדתי על האירוע, החשוב לתחקיר","החלטה לתקן ליקוי, למלא חסר או לחזק יתרון","הוראה מחייבת שמפרסם המפקד בעקבות האירוע לכל היחידה"],"e":"תוצאה או תולדה של עיון בממצאי התחקיר וניתוחם לאור אמות מידה מוסכמות.","p":210,"c":"g8","t":"הגדרות","id":"fee646c473"},{"k":"q","q":"מהו \"לקח\"?","a":"החלטה לתקן ליקוי, למלא חסר או לחזק יתרון","w":["תיאור עובדתי של רצף האירוע מתחילתו ועד סופו","הצעה לטיפול בפער שאינה בסמכות המפקד","עונש שנקבע למעורבים בעקבות האירוע"],"e":"בלקח יש חידוש, והוא מופק מניתוח הממצאים והמסקנות.","p":210,"c":"g8","t":"הגדרות","id":"c89b803a05"},{"k":"q","q":"מה מבדיל \"המלצה\" מ\"לקח\"?","a":"אין בסמכות המפקד המתחקר להפוך המלצה להוראה","w":["המלצה תמיד חשובה יותר מלקח ומחייבת יותר","המלצה מבוססת על ממצא אחד בלבד ולא על כמה","אין הבדל – שני המונחים זהים בתחקיר"],"e":"אין בסמכות המפקד האחראי לתחקיר להפוך המלצה להוראה, ולכן היא מופנית לרמה הממונה.","p":210,"c":"g8","t":"הגדרות","id":"986687b84f"},{"k":"q","q":"מהו \"יישום לקח\"?","a":"הפיכת הלקח למעשה בפקודות ובקרה על ביצוען","w":["כתיבת הלקח בדו\"ח התחקיר וחתימת המפקד","הפצת התחקיר לכל היחידות לצורך למידה","שיחת סיכום עם החיילים שהיו מעורבים"],"e":"הפיכת לקח למעשה באמצעות פקודות והוראות, ובקרה לטווח ארוך על ביצוען.","p":210,"c":"g8","t":"הגדרות","id":"0be98071f1"},{"k":"q","q":"על מי מוטלת בראש ובראשונה האחריות לבצע תחקיר?","a":"מפקד המסגרת בה אירע אירוע הבטיחות","w":["קצין הבטיחות החטיבתי של המסגרת","הרמטכ\"ל ואגף המבצעים במטכ\"ל","חוקרי המשטרה הצבאית החוקרת (מצ\"ח)"],"e":"","p":210,"c":"g8","t":"עקרונות מנחים","id":"bf5746d120"},{"k":"q","q":"איזו אווירה ישאף המפקד המתחקר ליצור?","a":"אווירת פתיחות ללא מורא לחשוף שגיאות, תקלות וביקורת","w":["אווירת חקירה ואיום, כדי שהמעורבים לא יסתירו פרטים מהאירוע","אווירה רשמית ומשמעתית בהתאם לפקודות","אווירה סודית שבה רק המפקד יודע את הממצאים"],"e":"","p":210,"c":"g8","t":"עקרונות מנחים","id":"ccfd8a51e4"},{"k":"q","q":"מה עושה מפקד כשמתנהלת במקביל חקירת מצ\"ח?","a":"מבצע תחקיר לאחר תיאום וקבלת דגשים מול פרקליט צבאי","w":["נמנע מתחקיר עד לסיום חקירת מצ\"ח והגשת מסקנותיה","ממתין לסיום החקירה ומאמץ את מסקנותיה כתחקיר","מעביר את התחקיר לידי מצ\"ח ואינו מעורב בו כלל"],"e":"","p":210,"c":"g8","t":"עקרונות מנחים","id":"2e65033f30"},{"k":"q","q":"מדוע יש לבצע את התחקיר סמוך ככל האפשר לאירוע?","a":"כדי למנוע איבוד פרטים ולהפיק לקחים מוקדם","w":["כדי לסיים את הטיפול באירוע מהר ככל האפשר","כדי שהמעורבים לא יתאמו ביניהם גרסאות","כי כך קובעת פקודת הרמטכ\"ל לכל אירוע"],"e":"כדי למנוע איבוד פרטים ולהשפיע מוקדם ככל הניתן באמצעות לקחים.","p":210,"c":"g8","t":"עקרונות מנחים","id":"153edf0854"},{"k":"q","q":"על מה מבוססת התשתית העובדתית (\"מה היה\") של התחקיר?","a":"על אמירת אמת","w":["על הערכות המפקד","על חוות דעת מומחים בלבד","על דו\"ח מצ\"ח"],"e":"","p":210,"c":"g8","t":"עקרונות מנחים","id":"b541123609"},{"k":"q","q":"מהו סדר הפרקים במודל התחקיר (אחרי הגדרת המוקד והתיחום)?","a":"מה היה צריך להיות ← מה היה ← הפער ← הסיבות לפער ← מסקנות ← הלקח ← המלצות לרמ\"מ","w":["מה היה ← מה היה צריך להיות ← מסקנות ← הפער ← הסיבות לפער ← הלקח ← המלצות לרמ\"מ","מה היה צריך להיות ← הפער ← מה היה ← מסקנות ← הסיבות לפער ← המלצות לרמ\"מ ← הלקח","מה היה ← הפער ← הסיבות לפער ← הלקח ← מסקנות ← מה היה צריך להיות ← המלצות לרמ\"מ"],"e":"","p":211,"c":"g8","t":"מודל התחקיר","id":"d2d4722d84"},{"k":"q","q":"מה מייחד את מוקד התחקיר בתחקיר בטיחות?","a":"אין בחירת מוקד – מתמקדים באירוע הבטיחות עצמו","w":["בוחרים שלושה מוקדים – אחד לכל דרג מעורב","המוקד הוא תמיד המפקד הבכיר שהיה באירוע","המוקד נבחר בידי קצין הבטיחות של הפיקוד הרלוונטי"],"e":"בשונה מתחקיר לחימה או אימון, בתחקיר בטיחות לא בוחרים מוקד.","p":211,"c":"g8","t":"מודל התחקיר","id":"654999b661"},{"k":"q","q":"מה כולל פרק \"מה היה צריך להיות\"?","a":"השוואה לפקודות, להוראות הבטיחות ולספרות המקצועית","w":["תיאור עובדתי של רצף האירוע מתחילתו ועד הפעולות המיידיות","המלצות לרמה הממונה לטיפול בפערים","סיכום חופשי של המפקד במילותיו הוא"],"e":"בפרק משווים את העובדות לפקודות, להוראות הבטיחות ולספרות המקצועית.","p":211,"c":"g8","t":"מודל התחקיר","id":"4540622c39"},{"k":"q","q":"מהו \"פער\" בתחקיר?","a":"ההבדל בין מה שהיה לבין מה שהיה צריך להיות","w":["ההבדל בין הממצאים של שני תחקירים שונים","ההבדל בין הדרגה הנדרשת לתפקיד לדרגה בפועל","ההבדל בין לקח לבין המלצה לרמה הממונה"],"e":"מה שהיה צריך להיות נקבע לפי הפקודות וההוראות. ייתכנו פערים רבים.","p":211,"c":"g8","t":"מודל התחקיר","id":"b7d2080ed9"},{"k":"q","q":"מה הן \"המלצות לרמה ממונה\"?","a":"הצעות לטיפול בפערים שאין בסמכותנו לבצען","w":["לקחים שהמפקד מבצע בעצמו בתוך יחידתו","ממצאי רקע על המעורבים ועל היחידה","נקודות לשימור שיש להפיץ ליחידות אחרות"],"e":"","p":211,"c":"g8","t":"מודל התחקיר","id":"fae4580e16"},{"k":"q","q":"לאילו מודלים תואם מודל תחקיר הבטיחות?","a":"לתחקיר אימון, מקצועי, לחימה ומשמעת","w":["למודל חקירה פלילית של מצ\"ח בלבד","למודל של ועדת חקירה ממלכתית","אינו תואם לאף מודל תחקיר אחר"],"e":"מודל תחקיר הבטיחות תואם למודל תחקיר אימון, תחקיר מקצועי, תחקיר לחימה ותחקיר משמעת.","p":214,"c":"g8","t":"מודל התחקיר","id":"15f9644737"},{"k":"q","q":"היכן ימצא התיאור הכללי של האירוע בדו\"ח?","a":"בתוך מסגרת מרובעת בתחילת המסמך","w":["בפסקה האחרונה בסוף המסמך","בנספח נפרד המצורף לדו\"ח","בפרק המסקנות שבאמצע הדו\"ח המלא"],"e":"","p":212,"c":"g8","t":"מבנה הדו\"ח","id":"4edcff028a"},{"k":"q","q":"מה יש לציין עבור כל אדם המוזכר בפרטים הכלליים?","a":"שם מלא, דרגה ומספר אישי","w":["שם פרטי ותפקיד בלבד","שם מלא, תפקיד ויחידה","שם, מספר טלפון וכתובת"],"e":"","p":212,"c":"g8","t":"מבנה הדו\"ח","id":"51c484ce26"},{"k":"q","q":"מהם שלושת סוגי הממצאים?","a":"ממצאי רקע, רצף כרונולוגי וממצאים נוספים","w":["ממצאים ישירים, ממצאים עקיפים וממצאים תורמים","תקלות, שגיאות ונקודות לשימור","ממצאים כלליים, מבצעיים ומנהליים"],"e":"","p":212,"c":"g8","t":"מבנה הדו\"ח","id":"4fa45a67f3"},{"k":"q","q":"היכן מסתיים הרצף הכרונולוגי?","a":"בגמר הפעולות המיידיות שננקטו בתגובה לאירוע","w":["ברגע התאונה עצמה, לפני שננקטו פעולות כלשהן בתגובה","בסיום כתיבת התחקיר וחתימת המפקד","בהגעת חוקרי מצ\"ח למקום האירוע"],"e":"","p":213,"c":"g8","t":"מבנה הדו\"ח","id":"db3b1d1451"},{"k":"q","q":"מה מאפיין את \"הממצאים הנוספים\"?","a":"ממצאים שאינם ברצף הכרונולוגי ומצביעים על גורמים תורמים","w":["ממצאי רקע על המעורבים באירוע ועל הכשרתם המקצועית הקודמת","המלצות לרמה הממונה שעלו במהלך איסוף הממצאים","ציטוטים מתוך עדויות המעורבים והעדים לאירוע"],"e":"הם אינם ברצף הכרונולוגי, אך מצביעים על תהליכים (גורמים תורמים), ויש לגביהם מסקנות.","p":214,"c":"g8","t":"מבנה הדו\"ח","id":"83cbd46377"},{"k":"q","q":"מהו \"הגורם הישיר\" לאירוע?","a":"השגיאה או התקלה שהביאה באופן פיזי ממשי לאירוע","w":["התנאים והנסיבות שאפשרו את התרחשות האירוע","הפקודה שלא נכתבה ולא הופצה בזמן ליחידה המבצעת","תנאי מזג האוויר והשטח בזמן האירוע"],"e":"ניתן להגדיר יותר מגורם ישיר אחד.","p":214,"c":"g8","t":"מבנה הדו\"ח","id":"88a316c881"},{"k":"q","q":"מהם \"גורמים תורמים\"?","a":"התנאים והתהליכים שאפשרו את האירוע – לרוב נסתרים","w":["הגורם הפיזי המיידי שהביא להתרחשות האירוע בשטח האימונים","העדים לאירוע והמעורבים בו באופן עקיף","הלקחים שהופקו מניתוח הממצאים והמסקנות"],"e":"התנאים, הנסיבות והתהליכים שאפשרו והשפיעו על התרחשות האירוע – לרוב נסתרים.","p":214,"c":"g8","t":"מבנה הדו\"ח","id":"18320bfe9b"},{"k":"q","q":"באיזה מודל מסווגים את הגורמים התורמים?","a":"5M – אדם, אמל\"ח, סביבה, פו\"ש, משימה","w":["SWOT – חוזקות, חולשות, הזדמנויות, איומים","PDCA – תכנון, ביצוע, בקרה, תיקון","4M – אדם, מכונה, שיטה, חומר"],"e":"","p":214,"c":"g8","t":"מבנה הדו\"ח","id":"e42c88bb47"},{"k":"q","q":"מהי \"תקלה\" בתחקיר?","a":"אי ביצוע נכון של משימה כתוצאה מחריגה מפקודה או הנחיה","w":["אי ביצוע נכון של משימה כתוצאה מטעות בשיקול הדעת","פעולה שבוצעה בצורה טובה שחשוב לציין ולשמר","תקלה טכנית בנשק או בציוד שגרמה לאירוע"],"e":"","p":215,"c":"g8","t":"מבנה הדו\"ח","id":"c4afd1c544"},{"k":"q","q":"מהי \"שגיאה\" בתחקיר?","a":"אי ביצוע נכון של משימה כתוצאה מטעות בשיקול הדעת","w":["אי ביצוע נכון של משימה כתוצאה מחריגה מפקודה","פעולה שבוצעה בצורה טובה שחשוב לציין ולשמר","ממצא רקע על הכשרת המעורבים באירוע"],"e":"","p":215,"c":"g8","t":"מבנה הדו\"ח","id":"6535bf745e"},{"k":"q","q":"מהן \"נקודות לשימור\"?","a":"פעולות שבוצעו בצורה טובה שחשוב לציין ולשמר","w":["פעולות שבוצעו באופן שגוי שיש לבטל מעתה","ציוד שיש לשמור במחסן עד סיום התחקיר","ממצאים סודיים שאסור להפיץ ליחידות אחרות בצה\"ל"],"e":"","p":215,"c":"g8","t":"מבנה הדו\"ח","id":"bf5fb7654e"},{"k":"q","q":"מה חייב לכלול כל לקח?","a":"מי עושה, מה עושה ועד מתי","w":["שם המתחקר ודרגתו בלבד","מספר הפקודה ותאריך האירוע","חתימת המח\"ט ואישור הפיקוד"],"e":"","p":215,"c":"g8","t":"מבנה הדו\"ח","id":"8f62cc3a31"},{"k":"q","q":"מהו \"סיכום המפקד\" בדו\"ח התחקיר?","a":"התייחסות חופשית של המפקד במילותיו (רשות)","w":["פרק חובה בניסוח קבוע לפי הוראות אמ\"ץ","רשימת הנפגעים באירוע ומצבם הרפואי","חתימת המפקד בלבד, ללא מלל נוסף"],"e":"ללא ניסוח צבאי מחייב.","p":215,"c":"g8","t":"מבנה הדו\"ח","id":"5b27ac95a6"},{"k":"q","q":"איזה פרק בתחקיר הוא \"תכלית תהליך התחקיר\"?","a":"פרק הלקחים","w":["פרק הממצאים","התיאור הכללי","פרק ההמלצות"],"e":"","p":215,"c":"g8","t":"מבנה הדו\"ח","id":"ea23ed38f6"},{"k":"q","q":"היכן בדו\"ח יופיעו עובדות כלליות על המעורבים (הכוח, הכשרתו, המשימה הכללית)?","a":"בממצאי הרקע","w":["ברצף הכרונולוגי","בממצאים הנוספים","בפרק הלקחים"],"e":"","p":213,"c":"g8","t":"מבנה הדו\"ח","id":"77f4382e8d"},{"k":"q","q":"באיזה פרק המתחקר מנתח ושופט את הממצאים ומסביר את הקשר הסיבתי ביניהם?","a":"פרק המסקנות","w":["פרק הממצאים","פרק הלקחים","התיאור הכללי"],"e":"","p":214,"c":"g8","t":"מבנה הדו\"ח","id":"10d68b3ab0"},{"k":"q","q":"כמה שלבים כולל תהליך הסקת המסקנות, ומהו הראשון?","a":"שניים – הראשון הוא קביעת הקשר הסיבתי","w":["שלושה – הראשון הוא איסוף הממצאים מהשטח","אחד – ניסוח הלקחים","ארבעה – הראשון הוא סיווג לפי 5M"],"e":"","p":214,"c":"g8","t":"מבנה הדו\"ח","id":"b4f796e3d7"},{"k":"q","q":"מה היה הגורם הישיר באירוע הפליטה בתחקיר לדוגמה (מוצב יפתח)?","a":"הכנסת מחסנית בצורה לא בטיחותית ולחיצה על ההדק","w":["תקלה טכנית במחסנית שגרמה לירי ספונטני של הנשק","רסיס מירי אויב שפגע בנשק ובחייל","נשק שהגיע מטיפול במצב דרוך ולא נבדק"],"e":"המחסנית הוכנסה כשהמכלול משוך, הנצרה פתוחה והמק-פורק מחוץ לקנה – ואז נלחץ ההדק.","p":218,"c":"g8","t":"התחקיר לדוגמה","id":"d82a8e94ae"},{"k":"q","q":"מה מהבאים לא הוגדר כגורם תורם באירוע לדוגמה?","a":"מזג אוויר קשה","w":["שגרת בטיחות לקויה בנוהל מחסנית בהכנס","רמה מקצועית נמוכה בתפעול הנשק","קליטה לקויה של מפקד המחלקה החדש"],"e":"","p":218,"c":"g8","t":"התחקיר לדוגמה","o":1,"id":"eaa96961d6"},{"k":"q","q":"איזה לקח נקבע בתחקיר לדוגמה?","a":"הצבת שלט \"עמדת פריקת נשקים פלוגתית\" ופריקה רק בעמדה זו","w":["ביטול נוהל \"מחסנית בהכנס\" בכל יחידות צה\"ל ובכל המוצבים","העברת הפלוגה לגזרה אחרת עד סיום התחקיר","העמדת המ\"מ לדין משמעתי בפני המג\"ד"],"e":"","p":219,"c":"g8","t":"התחקיר לדוגמה","id":"499a02d743"},{"k":"q","q":"בתחקיר לדוגמה – באיזה פרק יופיע \"הפלוגה סיימה הכשרה בבא\"ח 35 והחלה פעילות מבצעית במוצב יפתח\"?","a":"ממצאי רקע","w":["לקחים","מסקנות","רצף כרונולוגי"],"e":"","p":216,"c":"g8","t":"התחקיר לדוגמה","id":"da1a225da3"},{"k":"q","q":"מהי ההגדרה של \"טראומה\"?","a":"חבלה מגורם חיצוני, חום או תנועה","w":["מחלה כרונית שמתפתחת לאורך זמן","התקף לב או אירוע מוחי פתאומי","פגיעה נפשית בלבד, ללא נזק גופני"],"e":"בדרך כלל מלווה באיבוד דם.","p":222,"c":"g9","t":"מבוא ומשולש החיים","id":"611ff03d00"},{"k":"q","q":"מדוע סדרת המע\"רים עוסקת בעיקר בפציעות טראומה?","a":"אלו הפציעות השכיחות ביותר בקרב חיילי צה\"ל","w":["כי הן הפציעות הקלות ביותר לטיפול בשטח","כי אין להן טיפול יעיל בבית החולים, רק בשטח","כי כך קבע מד\"א בהסכם עם צה\"ל"],"e":"","p":222,"c":"g9","t":"מבוא ומשולש החיים","id":"ee12869d5a"},{"k":"q","q":"מהן שלוש המערכות של \"משולש החיים\"?","a":"נשימה, דם ועצבים","w":["נשימה, עיכול ושרירים","דם, עצמות ועור","לב, כליות וכבד"],"e":"פגיעה באחת המערכות גוררת פגיעה בשתיים האחרות.","p":222,"c":"g9","t":"מבוא ומשולש החיים","id":"bc714df0e3"},{"k":"q","q":"מה מהבאים אינו אחד משלושת תפקידי מערכת הדם לפי החוברת?","a":"בקרה ופיקוח על פעולת הלב","w":["הובלת חמצן, פחמן דו-חמצני, הורמונים וסוכרים","ויסות טמפרטורת הגוף","מערכת חיסונית (כדוריות דם לבנות)"],"e":"הבקרה והפיקוח הם תפקיד מערכת העצבים.","p":222,"c":"g9","t":"מבוא ומשולש החיים","o":1,"id":"cd475bf639"},{"k":"q","q":"איזו מערכת אחראית לבקרה ולפיקוח על כל מערכות הגוף, כולל הנשימה ופעולת הלב?","a":"מערכת העצבים","w":["מערכת הדם","מערכת הנשימה","מערכת העיכול"],"e":"","p":222,"c":"g9","t":"מבוא ומשולש החיים","id":"4917c39679"},{"k":"q","q":"מה יקרה כאשר אחת ממערכות משולש החיים נפגעת?","a":"גם שתי האחרות ייפגעו, ומצב הפצוע יידרדר במהירות","w":["שתי המערכות האחרות יפצו עליה ויייצבו את הפצוע","רק המערכת שנפגעה תושפע, והאחרות ימשיכו כרגיל","הפצוע יאבד הכרה מיד, בלי קשר למערכת שנפגעה"],"e":"תיגרר בעיה גם בשתי המערכות האחרות, ומצב הפצוע יידרדר במהירות.","p":223,"c":"g9","t":"מבוא ומשולש החיים","id":"a3c8c567b0"},{"k":"q","q":"מדוע המע\"רים תופסים חלק חשוב בשרשרת הטיפול והפינוי?","a":"הם הראשונים בשטח ומעניקים טיפול מציל חיים מהר","w":["הם מחליטים על אופן הפינוי ועל יעד הפינוי","הם מפעילים את מסוקי הפינוי ומכווינים אותם","הם אחראים על בית החולים השדה בגזרה"],"e":"הם הגורם הראשון בשטח, ולכן יכולים להעניק טיפול מציל חיים מהר ככל האפשר, עד הגעת צוות רפואי. מתוך דפי ההכנה.","p":222,"c":"g9","t":"מבוא ומשולש החיים","id":"6bb9ad066a"},{"k":"q","q":"מהי \"הכרה\"?","a":"סך המודעויות של האדם לסביבתו – מדד למערכת העצבים","w":["המדד לתפקוד מערכת הדם – לפי הדופק וספיקת הלב","קצב הנשימה של הפצוע בדקה – מדד לתפקוד מערכת הנשימה","מצב רוחו של הפצוע ויכולתו לשתף פעולה"],"e":"סך כל המודעויות של האדם לסובב אותו – המדד לתפקוד מערכת העצבים.","p":224,"c":"g9","t":"הכרה ורפלקסים","id":"57940c9886"},{"k":"q","q":"מהם שלושת מצבי ההכרה?","a":"הכרה מלאה, הכרה חלקית וחוסר הכרה","w":["ער, ישן ומחוסר הכרה לחלוטין","מגיב לקול, מגיב לכאב ומגיב למגע","פגיעה קלה, בינונית וקשה בהכרה"],"e":"מלאה – תגובה הגיונית; חלקית – תגובה לא הגיונית; חסר הכרה – חוסר תגובה.","p":224,"c":"g9","t":"הכרה ורפלקסים","id":"3b7f138cd4"},{"k":"q","q":"איזו בדיקה מע\"ר לעולם לא יבצע?","a":"בדיקת תגובה לכאב","w":["בדיקת תגובה לקול","בדיקת נשימה","סריקת גפיים"],"e":"","p":224,"c":"g9","t":"הכרה ורפלקסים","id":"fc6456c714"},{"k":"q","q":"פצוע שאינו מגיב לקול נחשב…","a":"חסר הכרה = חסר הגנה","w":["בהכרה חלקית = מוגן חלקית","בהכרה מלאה = מוגן","פצוע קל = ללא סכנה"],"e":"","p":224,"c":"g9","t":"הכרה ורפלקסים","id":"fc67d57952"},{"k":"q","q":"מהו \"רפלקס\"?","a":"תגובה אוטומטית של הגוף, בדרך כלל לצורכי הגנה","w":["תגובה רצונית ומודעת של הפצוע לכאב, לקול או למגע","מצב הכרה שבו הפצוע מגיב רק לכאב","סוג של נשימה שטחית ומהירה בהלם"],"e":"דוגמה: הרחקת יד מאש.","p":224,"c":"g9","t":"הכרה ורפלקסים","id":"8c41f4d076"},{"k":"q","q":"איזה מהבאים אינו רפלקס, אך שומר על דרכי האוויר פתוחות?","a":"טונוס השרירים","w":["רפלקס הבליעה","רפלקס השיעול","הרמת לסת"],"e":"טונוס – כיווץ טבעי של שריר הלשון.","p":224,"c":"g9","t":"הכרה ורפלקסים","o":1,"id":"c61495b0fc"},{"k":"q","q":"מה תפקיד רפלקס הבליעה?","a":"לדאוג שמזון ונוזלים ייכנסו לוושט ולא לקנה","w":["להוציא גוף זר מהקנה באמצעות שיעול","לשמור על הלשון במקומה ולמנוע את צניחתה","להאט את הדופק בזמן אכילה ושתייה"],"e":"","p":224,"c":"g9","t":"הכרה ורפלקסים","id":"eefe063f5d"},{"k":"q","q":"מהי הסכנה העיקרית לפצוע חסר הכרה שאינו מדמם?","a":"חנק כתוצאה מחסימת נתיב אוויר","w":["היפותרמיה כתוצאה מחשיפה לקור","הלם כתוצאה מירידה בלחץ הדם","נמק כתוצאה מחוסר תנועה"],"e":"","p":224,"c":"g9","t":"הכרה ורפלקסים","id":"794df4b283"},{"k":"q","q":"מה מהבאים אינו סימן לחסימת נתיב אוויר?","a":"דופק איטי וחזק","w":["התרחבות נחיריים","כחלון","אי שקט"],"e":"הסימנים: התרחבות נחיריים ובית חזה, אי שקט, נשימה חלקית, חיוורון, כחלון וחוסר הכרה.","p":224,"c":"g9","t":"הכרה ורפלקסים","o":1,"id":"259d750b80"},{"k":"q","q":"מהי \"שרשרת המוות\"?","a":"חסימת נתיב אוויר ← חנק ← דום נשימה ← דום לב ← מוות","w":["חסימת נתיב אוויר ← דום לב ← חנק ← דום נשימה ← מוות","דימום ← הלם ← היפותרמיה ← דום לב ← מוות","אובדן הכרה ← דימום ← דום נשימה ← דום לב ← מוות"],"e":"","p":225,"c":"g9","t":"הכרה ורפלקסים","id":"eb23808c3e"},{"k":"q","q":"אובדן איזה מנגנון מוביל לצניחת בסיס הלשון ולחסימת נתיב האוויר?","a":"טונוס השרירים","w":["רפלקס השיעול","רפלקס הבליעה","מערכת הדם"],"e":"אובדן השיעול – חדירת גופים זרים לקנה; אובדן הבליעה – שאיפת הפרשות.","p":224,"c":"g9","t":"הכרה ורפלקסים","id":"d312b5d8e2"},{"k":"q","q":"מהן שלוש קבוצות הפצועים?","a":"קלים, קשים שלא יינצלו, ואלה שישרדו רק בזכות טיפול","w":["קלים, בינוניים וקשים, לפי חומרת הפציעה","דחופים, לא דחופים והרוגים, לפי סדר הפינוי לבית החולים","בהכרה, בהכרה חלקית וחסרי הכרה"],"e":"קלים – לא ימותו גם ללא טיפול; קשים – ימותו גם עם טיפול מיטבי; והשלישית – ימותו ללא טיפול וישרדו בזכותו.","p":225,"c":"g9","t":"מוות בר הצלה","id":"7725b4875f"},{"k":"q","q":"מהו \"מוות בר הצלה\"?","a":"פצוע שימות אם לא יקבל טיפול מתאים וישרוד בזכותו","w":["פצוע שימות בכל מקרה, גם אם יקבל טיפול מיטבי","פצוע קל שישרוד גם אם לא יקבל כל טיפול","פצוע שכבר פונה לבית החולים ומצבו יציב"],"e":"בקבוצה זו מתמקד המע\"ר.","p":225,"c":"g9","t":"מוות בר הצלה","id":"f67b22a6a8"},{"k":"q","q":"לפי תרשים הגורמים למוות בר הצלה, איזה חלק ניתן להצלה רק אם הפצוע יגיע לחדר ניתוח?","a":"10%","w":["50%","1%","31%"],"e":"מכאן החשיבות של פינוי מהיר.","p":225,"c":"g9","t":"מוות בר הצלה","id":"a8e0bc6ac7"},{"k":"q","q":"מהו הגורם הגדול ביותר בתרשים הגורמים למוות בשדה הקרב?","a":"פגיעות ראש","w":["חזה אוויר בלחץ","חסימת נתיב אוויר","דימום שניתן לעצור בלחיצה"],"e":"","p":225,"c":"g9","t":"מוות בר הצלה","id":"53678006b2"},{"k":"q","q":"איזה מהגורמים למוות בר הצלה המע\"ר יכול לטפל בו בעצמו?","a":"דימום שניתן לעצור בלחיצה","w":["חזה אוויר בלחץ","דימום שניתן לעצור רק בניתוח","פגיעות ראש"],"e":"חזה אוויר בלחץ וחסימת נתיב אוויר מטופלים בשטח בידי רופאים ופרמדיקים.","p":225,"c":"g9","t":"מוות בר הצלה","id":"1ef7ec1013"},{"k":"q","q":"מה הוביל לשינוי בגישה לנפגעי טראומה?","a":"התרסקות מטוס של אורטופד ומשפחתו בשנות ה-70","w":["לקחי הטיפול בפצועים במלחמת יום הכיפורים","המצאת חוסם העורקים CAT והכנסתו לשימוש","מחקר של מד\"א על פצועי תאונות דרכים"],"e":"ההתרסקות הראתה שגישת ה-CPR אינה מתאימה לנפגעי טראומה.","p":226,"c":"g9","t":"סכימת הטיפול","id":"8464b83607"},{"k":"q","q":"מהו עקרון סכימת הטיפול בטראומה?","a":"מה שהורג קודם יטופל קודם","w":["מי שצועק הכי חזק יטופל קודם","הבכיר בדרגה יטופל קודם","מי שהגיע ראשון יטופל קודם"],"e":"מטפלים קודם בפצועים שימותו תוך דקות אם לא יינתן להם טיפול.","p":226,"c":"g9","t":"סכימת הטיפול","id":"f612960599"},{"k":"q","q":"מה פירוש האותיות בסכימת הטיפול SABC?","a":"בטיחות, נתיב אוויר, נשימה, דימומים","w":["בדיקה, אבחון, ביצוע, כיסוי הפצוע","שקט, אוויר, דם, הערכת מצב ההכרה","בטיחות, הכרה, נשימה, כיסוי ופינוי"],"e":"Safety, Airway, Breathing, Circulation.","p":226,"c":"g9","t":"סכימת הטיפול","id":"2150bb5c0b"},{"k":"q","q":"מדוע לא מבצעים עיסויי לב בפצועי טראומה?","a":"ההנחה היא שהלב עובד, ויש לעצור את הדימום","w":["כי עיסוי הלב מסוכן למטפל בשטח פתוח","כי אין זמן לעיסוי כשיש פצועים נוספים","כי המע\"ר אינו מוסמך לגעת בחזה הפצוע"],"e":"ההנחה היא שהלב עובד – יש לעצור דימומים ולהחזיר נפח נוזלים.","p":226,"c":"g9","t":"סכימת הטיפול","id":"5625f16369"},{"k":"q","q":"מה הדבר הראשון שעושה המע\"ר בשלב S?","a":"מרחיק את הפצוע ממקור הסכנה תוך קריאה לעזרה","w":["פותח את פי הפצוע בשיטת זשלא\"ג ובודק נתיב אוויר","בודק אם הפצוע נושם ומונה נשימות","מפשיט את הפצוע לחיפוש שט\"דים"],"e":"","p":227,"c":"g9","t":"סכימת הטיפול","id":"c62f28f25a"},{"k":"q","q":"מה מהבאים אינו חלק מהדיווח בקריאה לעזרה בשלב S?","a":"שם המשפחה של הפצוע","w":["זהות המדווח","סוג המתאר והאם עדיין מתמשך","מספר פצועים ודרישה לפינוי"],"e":"","p":227,"c":"g9","t":"סכימת הטיפול","o":1,"id":"6fd17fe858"},{"k":"q","q":"מה נאסר לעשות בבדיקת ההכרה בשלב S?","a":"לטלטל את הפצוע ולשפוך עליו מים","w":["לדבר אל הפצוע בקול רם ולשאול לשמו","לקרוא לפצוע בשמו ולגעת בכתפו","לבקש מהפצוע לפקוח עיניים"],"e":"","p":227,"c":"g9","t":"סכימת הטיפול","id":"a66ceeff61"},{"k":"q","q":"מה עושים בשלב S לנשק הפצוע?","a":"נוצרים אותו","w":["מפרקים אותו","משאירים אותו דרוך","נותנים אותו לפצוע"],"e":"","p":227,"c":"g9","t":"סכימת הטיפול","id":"afdb79c234"},{"k":"q","q":"כיצד פותחים את פי הפצוע בשלב A?","a":"בשיטת זשלא\"ג","w":["בהטיית הראש לאחור","בכף יד פתוחה","בעזרת מקל או כף"],"e":"זרת, שלוש אצבעות, אגודל. אם לא נפתח – זשלא\"ג כפול.","p":227,"c":"g9","t":"סכימת הטיפול","id":"19e0c94f67"},{"k":"q","q":"כיצד מסלקים הפרשות מפי הפצוע?","a":"הטיית הפצוע על הצד בחטיבה אחת – \"בול עץ\"","w":["הושבת הפצוע והטיית ראשו קדימה","שפיכת מים לפה כדי לשטוף את ההפרשות החוצה","הטיית הראש בלבד הצידה בחוזקה"],"e":"ההטיה נעשית תוך קיבוע עמוד השדרה.","p":227,"c":"g9","t":"סכימת הטיפול","id":"b84a748961"},{"k":"q","q":"מדוע מבצעים הרמת לסת ולא הטיית ראש לאחור?","a":"מחשש לפגיעה בעמוד השדרה הצווארי","w":["כי הרמת לסת מהירה יותר לביצוע","כי הטיית ראש פותחת את הפה יותר מדי","כי בפצוע טראומה הלשון לא צונחת"],"e":"","p":227,"c":"g9","t":"סכימת הטיפול","id":"7e8f6a04ac"},{"k":"q","q":"פצוע בהכרה שמדבר – מה המשמעות לשלב A?","a":"אין חשש לנתיב האוויר וניתן לעבור לשלב B","w":["יש לבצע זשלא\"ג כפול לפני המעבר לשלב B","יש לבצע הנשמה מפה לפה כבר בשלב זה","יש לבדוק תגובה לכאב לפני כל טיפול"],"e":"","p":227,"c":"g9","t":"סכימת הטיפול","id":"5f2bf02b16"},{"k":"q","q":"מהי מטרת בדיקת הנשימה בשלב B?","a":"לבדוק קיום נשימה בלבד – מע\"רים לא מנשימים בשטח","w":["להתחיל הנשמה מפה לפה אם הפצוע אינו נושם בכוחות עצמו","למדוד את הדופק ואת קצב הלב של הפצוע","לבדוק את מצב ההכרה בתגובה לקול ולכאב"],"e":"","p":228,"c":"g9","t":"סכימת הטיפול","id":"c73de1661a"},{"k":"q","q":"מה מבצעים בשלב C?","a":"סריקת הגפיים והראש ועצירת דימומים בלחץ ישיר","w":["בדיקת קיום נשימה וספירת קצב הנשימות","הערכה מחודשת של מצב ההכרה של הפצוע","הפשטה מלאה של הפצוע וחיפוש שט\"דים נסתרים"],"e":"סריקה חפוזה; בעצירת הדימומים העדיפות היא ללחץ ישיר.","p":228,"c":"g9","t":"סכימת הטיפול","id":"887f1a19cd"},{"k":"q","q":"מה מאפיין את \"קו הפינוי המיידי\" בסוף שלב C?","a":"קיבוע הפצוע, כיסויו ודיווח בקשר – השאיפה לפנותו מהשטח","w":["המשך מיידי לשלבים D ו-E – תמיד, גם אם הפינוי כבר מוכן","חזרה לשלב S – בדיקה חוזרת של בטיחות הזירה","המתנה לרופא – אסור להזיז את הפצוע לפני בואו"],"e":"אם הפינוי מתעכב ממשיכים לשלבים D ו-E.","p":228,"c":"g9","t":"סכימת הטיפול","id":"887b5ba82f"},{"k":"q","q":"מה כולל הדיווח בסוף שלב C?","a":"מנגנון הפציעה, מצב ההכרה ומצב הנשימה","w":["שם הפצוע, דרגתו, מספרו האישי ויחידתו","סוג הנשק ומספר המחסניות שנותרו","שעת הפציעה ושם המטפל בלבד"],"e":"","p":228,"c":"g9","t":"סכימת הטיפול","id":"ea16aa7155"},{"k":"q","q":"מה מתבצע בשלב D (Disability)?","a":"הערכה מחודשת של מצב ההכרה","w":["בדיקה חוזרת של הנשימה","הפשטה מלאה וחיפוש פצעים","עצירת דימומים בלחץ עקיף"],"e":"","p":228,"c":"g9","t":"סכימת הטיפול","id":"a1ff301f1b"},{"k":"q","q":"היכן מחפשים שט\"דים נסתרים בשלב E?","a":"בית השחי, הגב והעכוז","w":["כפות הידיים והאצבעות","הראש והקרקפת בלבד","כפות הרגליים והקרסוליים"],"e":"","p":228,"c":"g9","t":"סכימת הטיפול","id":"1df7a0e300"},{"k":"q","q":"מה גורמת היפותרמיה לפצוע טראומה?","a":"פוגעת בגורמי הקרישה ומחמירה את הדימום","w":["מכווצת את כלי הדם ועוצרת את הדימום","מעלה את לחץ הדם ומשפרת את ההכרה","אין לה השפעה על פצוע טראומה"],"e":"","p":228,"c":"g9","t":"סכימת הטיפול","id":"1373e8f10e"},{"k":"q","q":"מתחת לאיזו טמפרטורת גוף מוגדרת היפותרמיה?","a":"35 מעלות","w":["37 מעלות","30 מעלות","32 מעלות"],"e":"","p":228,"c":"g9","t":"סכימת הטיפול","id":"5063a96e82"},{"k":"q","q":"מדוע אין לתת שתייה לפצוע בהלם, מעורפל או חסר הכרה?","a":"סכנת אספירציה וסיכוי שיזדקק לניתוח","w":["השתייה מעלה את הדופק ומחמירה את ההלם","השתייה מקררת את הגוף וגורמת להיפותרמיה","המים בשטח מוגבלים ונדרשים למטפלים"],"e":"אספירציה – הקאה וכניסת נוזלים לריאות.","p":229,"c":"g9","t":"סכימת הטיפול","id":"a4c93a583d"},{"k":"q","q":"היכן תיחבש פציעת ראש?","a":"בשלב C על ידי לחץ ישיר","w":["בשלב A","בשלב E בלבד","אין לחבוש פציעת ראש"],"e":"","p":228,"c":"g9","t":"סכימת הטיפול","id":"b90984b11a"},{"k":"q","q":"מהו \"מסתור\"?","a":"מקום המסתיר מפני האויב אך אינו מגן מאש שטוחת מסלול","w":["מקום המגן מפני אש שטוחת מסלול וגם מסתיר מעיני האויב","בית חולים שדה הממוקם הרחק מקו האש","נקודת שחלוף שבה מעבירים פצועים לרכב"],"e":"","p":229,"c":"g9","t":"מתאר מאוים","id":"a39cd50744"},{"k":"q","q":"מהו \"מחסה\"?","a":"מקום המגן מפני אש שטוחת מסלול","w":["מקום המסתיר מהאויב בלבד, ללא הגנה","עמדת תצפית מוגבהת לאיתור האויב","רכב פינוי משוריין של התאג\"ד"],"e":"במחסה מתבצעת כל סכימת הטיפול.","p":229,"c":"g9","t":"מתאר מאוים","id":"bb4cd96440"},{"k":"q","q":"אילו פעולות מתבצעות במסתור?","a":"פעולות מיידיות בלבד – נתיב אוויר ושט\"דים","w":["כל סכימת הטיפול, משלב S ועד שלב E","הפשטה מלאה של הפצוע וחיפוש פצעים נסתרים","קיבוע הפצוע והעלאתו למסוק פינוי"],"e":"פתיחת נתיב אוויר ועצירת שט\"דים; כל הסכימה מתבצעת במחסה.","p":229,"c":"g9","t":"מתאר מאוים","id":"c35dd30f5a"},{"k":"q","q":"כיצד עוצרים דימום במתאר מאוים?","a":"בלחץ עקיף – בעדיפות ראשונה CAT ובעדיפות שנייה ח.ע גומי","w":["בלחץ ישיר – בעדיפות ראשונה תחבושת אישית ובשנייה משולש","בנקודת לחיצה בלבד – באגרוף על העורק הקרוב","אין עוצרים דימום תחת אש – רק מפנים למחסה"],"e":"","p":229,"c":"g9","t":"מתאר מאוים","id":"18e7ee6491"},{"k":"q","q":"מה העדיפות לעצירת דימום במתאר שאינו מאוים?","a":"לחץ ישיר (תחבושת אישית)","w":["חוסם עורקים (CAT)","נקודת לחיצה (באגרוף)","ח.ע מאולתר (הולנדי)"],"e":"","p":229,"c":"g9","t":"מתאר מאוים","id":"3983b32697"},{"k":"q","q":"מה ההבדל בין שט\"ד חיצוני לשט\"ד פנימי?","a":"חיצוני נשלט בשטח; פנימי אינו נשלט ומחייב פינוי מיידי","w":["פנימי מטופל בשטח; חיצוני מטופל רק בבית החולים בניתוח","אין הבדל – שניהם מטופלים בחוסם עורקים בשטח","חיצוני תמיד קטלני יותר; פנימי אינו מחייב פינוי"],"e":"","p":231,"c":"g9","t":"דימומים והלם","id":"8dc3297446"},{"k":"q","q":"מהן שלוש הסכנות של שט\"ד?","a":"הלם, היפותרמיה ונמק","w":["חנק, שבר ונמק","זיהום, חום וכאב","התייבשות, מכת חום והלם"],"e":"","p":231,"c":"g9","t":"דימומים והלם","id":"264b2f897b"},{"k":"q","q":"מה עושים כדי למנוע נמק לאחר הנחת ח.ע?","a":"רושמים את שעת ההנחה ודואגים להמרה בהקדם","w":["מסירים את החוסם אחרי י הגובה?","a":"חום","w":["כחול","ירוק","שחור"],"e":"","p":244,"c":"g10","t":"מושגי יסוד","id":"49ac2045ff"},{"k":"q","q":"מה ההפרש בין קו גובה לקו גובה סמוך?","a":"10 מטרים","w":["100 מטרים","5 מטרים","50 מטרים"],"e":"","p":244,"c":"g10","t":"מושגי יסוד","id":"8724146722"},{"k":"q","q":"מה מציינים קווי גובה עבים?","a":"מאות מטרים","w":["אלפי מטרים","נחלים","גבולות"],"e":"","p":244,"c":"g10","t":"מושגי יסוד","id":"7b2b090b47"},{"k":"q","q":"קווי גובה צפופים מאוד מעידים על…","a":"שטח תלול","w":["שטח מתון","שטח מישורי","נחל"],"e":"ככל שקווי הגובה רחוקים יותר – השטח מתון יותר.","p":244,"c":"g10","t":"מושגי יסוד","id":"b3bfe6cc81"},{"k":"q","q":"מה נכון לגבי מרחקים שנמדדים במפה?","a":"המפה מראה רק את המרחק האווירי, שקטן מהמרחק האמיתי בשטח","w":["המרחק במפה תמיד גדול מהמרחק האמיתי בשטח","אין הבדל בין המרחק במפה למרחק האמיתי בשטח","המפה מראה את מרחק ההליכה המדויק בשטח, כולל העליות והירידות"],"e":"בנחל יש למדוד במקטעים לשם דיוק.","p":244,"c":"g10","t":"מושגי יסוד","o":1,"id":"6475c2e48b"},{"k":"q","q":"מה ההבדל בין מפה גיאוגרפית למפה טופוגרפית?","a":"גיאוגרפית – שטח נרחב בלי פרטים; טופוגרפית – כל פרטי הנוף","w":["גיאוגרפית – כל פרטי הנוף; טופוגרפית – שטח נרחב בלי פרטים","גיאוגרפית – מדויקת לניווט; טופוגרפית – גבולות מדינות בלבד","אין הבדל – שני השמות מתארים אותה מפה בקני מידה שונים"],"e":"גיאוגרפית – שטח נרחב בלי פרטים (גבולות, אוצרות טבע); טופוגרפית – כל פרטי הנוף וגבהים מדויקים, בסיס לניווט.","p":247,"c":"g10","t":"מושגי יסוד","id":"e75bc788d2"},{"k":"q","q":"מהי \"כיפה\"?","a":"נקודת שיא – מכל כיוון מתקדמים בירידה","w":["נקודה נמוכה המחברת בין שתי שלוחות","בלט מוארך היורד ממקום גבוה כלפי מטה","שקע מוארך המתנקז אל ערוץ הנחל"],"e":"מסומנת בקווי גובה סגורים, שאינם בהכרח מעגליים.","p":245,"c":"g10","t":"צורות שטח","id":"0e1561335d"},{"k":"q","q":"מהי \"כיפה סמויה\"?","a":"כיפה נמוכה מהפרש קווי הגובה, ולכן אינה מסומנת","w":["כיפה המוסתרת בעצים ולכן אינה נראית בשטח","כיפה הנמצאת מתחת לפני הים ומסומנת בכחול","כיפה שמסומנת בקו מקווקו בגלל מצוק תלול הסמוך אליה"],"e":"היא אינה מסו  הכוונת ואת המטרה","זה אסור לפי הוראות הבטיחות במטווח"],"e":"","p":298,"c":"g12","t":"מצבי ירי","id":"2693428e3a"},{"k":"q","q":"באיזו זווית למטרה עומדים בעמידה אינסטינקטיבית?","a":"45 מעלות","w":["90 מעלות","מול המטרה (0 מעלות)","60 מעלות"],"e":"מול המטרה – יותר שטח גוף חשוף; ב-90 – הקת \"תברח\".","p":300,"c":"g12","t":"מצבי ירי","id":"2d0c4593f5"},{"k":"q","q":"מתי משתמשים בעמידה אינסטינקטיבית?","a":"כשנדרשת תגובה מהירה או כשאי אפשר לכרוע או לשכב","w":["רק באיפוס הנשק במטווח ה-25 מטר, כשאין שק משען","רק בירי לילה בכוונות ברזל","בירי ממארב מאחורי מחסה נמוך, כשיש זמן להתכונן"],"e":"למשל בירי תוך תנועה.","p":300,"c":"g12","t":"מצבי ירי","id":"6082d743e5"},{"k":"q","q":"מהם מצבי הירי המוזכרים בחוברת?","a":"שכיבה, כריעה, ישיבה ועמידה","w":["שכיבה, ישיבה, זחילה ועמידה","כריעה, ריצה, ישיבה ועמידה","שכיבה, עמידה, כריעה וקפיצה"],"e":"בדף ההכנה מופיעים שלושה (שכיבה, כריעה ועמידה); החוברת מזכירה גם ישיבה כאחד המצבים הגבוהים.","p":295,"c":"g12","t":"מצבי ירי","id":"98da9c7b5f"},{"k":"q","q":"לאילו שני סוגים מתחלק מצב שכיבה?","a":"שכיבה בסיסית ו\"שכב חפה\"","w":["שכיבה וכריעה","\"רד חפה\" ו\"שכב חפה\"","שכיבה על הבטן ושכיבה על הצד"],"e":"","p":295,"c":"g12","t":"מצבי ירי","id":"d4ef55b465"},{"k":"q","q":"מהו \"שכב חפה\"?","a":"מצב שכיבה דינמי המתאים להיתקלויות","w":["מצב כריעה מהיר המתאים לירי בתנועה","מצב עמידה אינסטינקטיבי לטווח קצר","מצב ירי מאחורי מחסה גבוה במארב"],"e":"","p":295,"c":"g12","t":"מצבי ירי","id":"5031ae2ae5"},{"k":"q","q":"מתי לא ניתן לבצע ירי במצב שכיבה?","a":"בירי מעל מחסה גבוה, תוך ריצה או ממארב במדרון","w":["רק בלילה, כשאין ראייה טובה של המטרה ושל הכוונות","כשהמטרה קרובה מ-50 מטר לעמדת הירי","כשיש רוח צד חזקה המסיטה את הקליע"],"e":"מחסה בינוני או גבוה. אז יורים באחד המצבים הגבוהים: כריעה, ישיבה או עמידה.","p":295,"c":"g12","t":"מצבי ירי","id":"f6e2a06cd3"},{"k":"q","q":"מה מהבאים אינו יתרון של מצב שכיבה?","a":"זה המצב הנוח ביותר","w":["ירי מדויק יותר בזכות ריבוי נקודות מגע עם הקרקע","היורה חשוף פחות לאש האויב","זה המצב היציב ביותר"],"e":"","p":295,"c":"g12","t":"מצבי ירי","o":1,"id":"19f949f86c"},{"k":"q","q":"מה מהבאים אינו דגש לכניסה למצב שכיבה?","a":"זווית של 60 מעלות ביד האוחזת במתפסים","w":["זווית של 90 מעלות בין הזרוע לאמה ביד התומכת","רגל מקבילה לנשק ולציר הקנה","זווית ממוצעת של 45 מעלות בין גוף היורה לקו הקנה"],"e":"","p":296,"c":"g12","t":"מצבי ירי","o":1,"id":"f18e619e0c"},{"k":"q","q":"מה מהבאים אינו דגש למצב שכיבה?","a":"למשוך את הנשק בחוזקה לתוך שקע הכתף","w":["להישען על העצמות ולא על כוח השרירים","משקל הגוף נשען על המרפקים שבקרקע","לחי סחוטה על הקת בקלילות וביציבות"],"e":"","p":296,"c":"g12","t":"מצבי ירי","o":1,"id":"1865bb13b2"},{"k":"q","q":"מה מהבאים הוא דגש לירי בכריעה?","a":"90 מעלות בין הרגליים וישבן נשען על עקב רגל ימין","w":["מרפק שמאל מונח על הברך השמאלית לייצוב","כף הרגל השמאלית כולה צמודה לרצפה","45 מעלות בין הרגליים וישבן נשען על עקב רגל שמאל"],"e":"וכן: שליש מהקת מעל שקע הכתף, ומרפק יד ימין רפוי וצמוד לגוף.","p":298,"c":"g12","t":"מצבי ירי","o":1,"id":"cc9b121bd0"},{"k":"q","q":"כיצד נכנסים לעמידה אינסטינקטיבית?","a":"בתנועה אגרסיבית – הרגל החלשה לפנים ב-45° למטרה","w":["לאט ובזהירות – שתי הרגליים במקביל למטרה","בקפיצה לאחור – הרגל החזקה לפנים ב-90° למטרה","בירידה לברך – הרגל החלשה מאחור ב-45° למטרה"],"e":"הפעולה האגרסיבית נועדה לבלום את הגוף אחרי התנועה.","p":300,"c":"g12","t":"מצבי ירי","id":"0833b76e5f"},{"k":"q","q":"מדוע יש לשמור על אחיזה יציבה בעמידה אינסטינקטיבית?","a":"אין במצב זה נקודות אחיזה רבות והכניסה אליו מהירה","w":["כי הנשק כבד יותר בעמידה ומושך את הידיים כלפי מטה","כי במצב זה יורים כדור אחד בלבד","כי היורה חשוף לחלוטין לאש האויב"],"e":"","p":301,"c":"g12","t":"מצבי ירי","id":"7c530baffa"},{"k":"q","q":"מה מהבאים אינו דגש לעמידה אינסטינקטיבית?","a":"שליש מהקת מעל שקע הכתף","w":["גב ישר","שני שלישים מהקת מעל שקע הכתף","כפות רגליים מקבילות"],"e":"שליש מהקת מעל שקע הכתף – זה הדגש בכריעה.","p":302,"c":"g12","t":"מצבי ירי","o":1,"id":"d467730718"},{"k":"q","q":"מה הפעולה הראשונה בתפעול כל מעצור?","a":"מבט אל מכלול הנשק לזיהוי המעצור","w":["הוצאת המחסנית ובדיקת הכדורים","דריכה מ
